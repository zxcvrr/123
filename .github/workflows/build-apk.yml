name: Build APK

# 在没有安装 Android SDK 的机器上也能拿到 APK：
# 把 deepseek-mobile 作为仓库根目录推上去，Actions 会自动构建，
# 构建好的 app-debug.apk 在本次运行的 Artifacts 里下载。

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:        # 也可以在 Actions 页面手动点一下运行

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Node（只用来同步网页资源）
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 同步网页资源到 Android assets
        run: node tools/sync-assets.mjs

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 不依赖 android-actions/setup-android：实测它并不会把 sdkmanager 放进 PATH，
      # 而 runner 镜像本来就预装了 SDK（ANDROID_HOME=/usr/local/lib/android/sdk）。
      # 这里自己按候选位置找 sdkmanager；找不到也放行，交给 Gradle 使用/自动下载预装组件。
      # 同时打印 SDK 实况，万一 platform 版本不匹配，看日志就能定位。
      - name: 准备 Android SDK
        run: |
          SDK="${ANDROID_HOME:-}"
          if [ -z "$SDK" ]; then SDK="${ANDROID_SDK_ROOT:-}"; fi
          if [ -z "$SDK" ]; then SDK="/usr/local/lib/android/sdk"; fi
          echo "SDK 路径: $SDK"

          echo "--- 预装 platforms ---"
          ls -1 "$SDK/platforms" 2>/dev/null || echo "(没有 platforms 目录)"
          echo "--- 预装 build-tools ---"
          ls -1 "$SDK/build-tools" 2>/dev/null || echo "(没有 build-tools 目录)"
          echo "--- 许可文件 ---"
          ls -1 "$SDK/licenses" 2>/dev/null || echo "(没有 licenses 目录)"

          # 逐个候选位置找 sdkmanager：PATH → cmdline-tools/*/bin → 全盘兜底
          SDKM="$(command -v sdkmanager 2>/dev/null || true)"
          if [ -z "$SDKM" ]; then
            SDKM="$(ls -1 "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n 1 || true)"
          fi
          if [ -z "$SDKM" ]; then
            SDKM="$(find "$SDK" -maxdepth 4 -type f -name sdkmanager 2>/dev/null | head -n 1 || true)"
          fi

          if [ -z "$SDKM" ]; then
            echo "::warning::未找到 sdkmanager，跳过组件安装；Gradle 会使用或自动下载预装组件"
            exit 0
          fi

          echo "使用 sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          if "$SDKM" --install "platforms;android-34" "build-tools;34.0.0" "platform-tools"; then
            echo "SDK 组件已就绪"
          else
            echo "::warning::组件安装失败，继续用已有组件构建"
          fi

      - name: 准备 Gradle（AGP 8.5 需要 Gradle 8.7+）
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 构建 debug APK
        working-directory: android
        run: |
          echo "--- 环境 ---"
          java -version 2>&1 | head -n 1
          gradle --version | head -n 6
          echo "--- 开始构建 ---"
          gradle assembleDebug --no-daemon --stacktrace

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-mobile-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
